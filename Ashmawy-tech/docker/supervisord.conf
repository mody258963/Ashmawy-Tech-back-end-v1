[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm-error.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log

[program:laravel-scheduler]
command=/var/www/html/docker/schedule-runner.sh
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/scheduler.log
stderr_logfile=/var/log/supervisor/scheduler-error.log

[program:laravel-queue-iot]
command=php /var/www/html/artisan queue:work --queue=iot --sleep=1 --tries=3 --backoff=2 --timeout=120
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=35
stdout_logfile=/var/log/supervisor/queue-iot.log
stderr_logfile=/var/log/supervisor/queue-iot-error.log

[program:iot-mqtt-subscribe]
command=php /var/www/html/artisan iot:mqtt-subscribe
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=36
stdout_logfile=/var/log/supervisor/iot-mqtt.log
stderr_logfile=/var/log/supervisor/iot-mqtt-error.log

