# Dokploy: use Git (or upload full repo), not "docker raw"
# Build context must include Dockerfile + this compose file
# Set IOT_JWT_SECRET in Dokploy environment (same as Laravel .env)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      MQTT_HOST: emqx
      REDIS_HOST: redis
      DB_HOST: mysql
      DB_PORT: 3306
      QUEUE_CONNECTION: redis
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    depends_on:
      - mysql
      - redis
      - emqx
    networks:
      - dokploy-network

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: user
      MYSQL_ROOT_PASSWORD: user123
      MYSQL_USER: user
      MYSQL_PASSWORD: user123
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dokploy-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - dokploy-network

  emqx:
    image: emqx/emqx:5.6
    restart: unless-stopped
    environment:
      EMQX_AUTHENTICATION__1__MECHANISM: jwt
      EMQX_AUTHENTICATION__1__USE_JWKS: "false"
      EMQX_AUTHENTICATION__1__ALGORITHM: hmac-based
      EMQX_AUTHENTICATION__1__SECRET: ${IOT_JWT_SECRET}
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "8883:8883"
      - "18083:18083"
    networks:
      - dokploy-network

volumes:
  mysql_data:

networks:
  dokploy-network:
    external: true
    name: dokploy-network
