version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ashmawytech_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - MQTT_HOST=emqx
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    depends_on:
      - mysql
      - redis
      - emqx
    networks:
      - ashmawytech_network

  mysql:
    image: mysql:8.0
    container_name: ashmawytech_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: user
      MYSQL_ROOT_PASSWORD: user123
      MYSQL_USER: user
      MYSQL_PASSWORD: user123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ashmawytech_network

  redis:
    image: redis:7-alpine
    container_name: ashmawytech_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ashmawytech_network

  emqx:
    image: emqx/emqx:5.6
    container_name: ashmawytech_emqx
    restart: unless-stopped
    environment:
      EMQX_AUTHENTICATION__1__MECHANISM: jwt
      EMQX_AUTHENTICATION__1__USE_JWKS: "false"
      EMQX_AUTHENTICATION__1__ALGORITHM: hmac-based
      EMQX_AUTHENTICATION__1__SECRET: "${IOT_JWT_SECRET:NUsJccDeurWzmtgVBpdCKnktGa1tFjfAohGzdM2NYKf}"
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "8883:8883"
      - "18083:18083"
    networks:
      - ashmawytech_network

volumes:
  mysql_data:

networks:
  ashmawytech_network:
    driver: bridge

