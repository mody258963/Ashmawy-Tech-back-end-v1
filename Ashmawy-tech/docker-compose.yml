# Dokploy: use Git (or upload full repo), not "docker raw"
# Build context must include Dockerfile + this compose file
# Set IOT_JWT_SECRET in Dokploy environment (same as Laravel .env)
#
# Low-RAM profile for 4 GB VPS (approx. 1.9 GiB total for this stack).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    mem_limit: 450m
    memswap_limit: 450m
    ports:
      - "8000:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      MQTT_HOST: emqx
      REDIS_HOST: redis
      DB_HOST: mysql
      DB_PORT: 3306
      QUEUE_CONNECTION: redis
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    depends_on:
      - mysql
      - redis
      - emqx
    networks:
      - ashmawytech_network

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 900m
    memswap_limit: 900m
    command: >
      --innodb-buffer-pool-size=512M
      --max-connections=40
      --tmp-table-size=32M
      --max-heap-table-size=32M
    environment:
      MYSQL_DATABASE: user
      MYSQL_ROOT_PASSWORD: user123
      MYSQL_USER: user
      MYSQL_PASSWORD: user123
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ashmawytech_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 200m
    memswap_limit: 200m
    command: redis-server --maxmemory 150mb --maxmemory-policy allkeys-lru
    networks:
      - ashmawytech_network

  emqx:
    image: emqx/emqx:5.6
    restart: unless-stopped
    mem_limit: 350m
    memswap_limit: 350m
    environment:
      EMQX_AUTHENTICATION__1__MECHANISM: jwt
      EMQX_AUTHENTICATION__1__USE_JWKS: "false"
      EMQX_AUTHENTICATION__1__ALGORITHM: hmac-based
      EMQX_AUTHENTICATION__1__SECRET: ${IOT_JWT_SECRET}
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "8883:8883"
      - "18083:18083"
    networks:
      - ashmawytech_network

volumes:
  mysql_data:

networks:
  ashmawytech_network:
    external: true
    name: ashmawytech_network
