version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ashmawytech_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    depends_on:
      - mysql
    networks:
      - ashmawytech_network

  mysql:
    image: mysql:8.0
    container_name: ashmawytech_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: root
      MYSQL_ROOT_PASSWORD: user123
      MYSQL_USER: user
      MYSQL_PASSWORD: user123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ashmawytech_network

  redis:
    image: redis:7-alpine
    container_name: ashmawytech_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ashmawytech_network

volumes:
  mysql_data:

networks:
  ashmawytech_network:
    driver: bridge

